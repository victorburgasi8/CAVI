<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{--bg:#faf8f5;--tx:#222;--card:#fff;--ac:#1f7a4d;--bd:#e5e0d8}
@media(prefers-color-scheme:dark){:root{--bg:#18181a;--tx:#eee;--card:#242427;--bd:#38383c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
h1{font-size:1.2rem;margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--ac);color:#fff}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:18px;max-width:1100px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.c img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:3rem}
.b{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.b h2{font-size:1rem;margin:0}.p{font-weight:700;color:var(--ac)}
ul{margin:0;padding-left:18px;font-size:.88rem;opacity:.85}select{padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.b button{margin-top:auto}.ag{opacity:.5}
#cart{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);border-left:1px solid var(--bd);transform:translateX(100%);transition:.25s;z-index:10;display:flex;flex-direction:column;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
#cart.o{transform:none}#items{flex:1;overflow:auto}.it{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.q button{padding:2px 9px}.q{white-space:nowrap}textarea,input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-top:6px}
#wa{background:#25d366;color:#04371a;font-weight:700;margin-top:10px}
</style></head><body>
<header><h1 id="t">Catálogo</h1><button id="vc">🛒 Pedido (<span id="n">0</span>)</button></header>
<main id="g"></main>
<aside id="cart"><div style="display:flex;justify-content:space-between"><b>Tu pedido</b><button class="sec" id="x">Cerrar</button></div>
<div id="items"></div><b id="tot"></b>
<input id="nom" placeholder="Tu nombre"><textarea id="nota" rows="2" placeholder="Notas (dirección, hora de entrega…)"></textarea>
<button id="wa">Enviar pedido por WhatsApp</button></aside>
<script>
let D={productos:[]},C=[];const $=i=>document.getElementById(i);
const m=v=>D.moneda+Number(v).toFixed(2);
try{C=JSON.parse(localStorage.getItem('c')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('c',JSON.stringify(C))}catch(e){}};
fetch('data/catalogo.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;$('t').textContent=d.nombre_tienda;document.title=d.nombre_tienda;draw();cart()});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){$('g').innerHTML=D.productos.map((p,i)=>`<div class="c ${p.disponible===false?'ag':''}">
${p.imagen?`<img loading="lazy" src="${esc(p.imagen)}" alt="${esc(p.nombre)}">`:'<div class="ph">📦</div>'}
<div class="b"><h2>${esc(p.nombre)}</h2><div class="p">${m(p.precio)}</div>
<ul>${(p.caracteristicas||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
${(p.tallas||[]).length?`<select id="s${i}">${p.tallas.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`:''}
<button ${p.disponible===false?'disabled':''} onclick="add(${i})">${p.disponible===false?'Agotado':'Agregar al pedido'}</button></div></div>`).join('')}
function add(i){const p=D.productos[i],s=$('s'+i)?.value||'',k=C.find(x=>x.n===p.nombre&&x.t===s);
k?k.q++:C.push({n:p.nombre,t:s,q:1,p:p.precio});save();cart();$('cart').classList.add('o')}
function ch(i,d){C[i].q+=d;if(C[i].q<1)C.splice(i,1);save();cart()}
function cart(){$('n').textContent=C.reduce((a,x)=>a+x.q,0);
$('items').innerHTML=C.length?C.map((x,i)=>`<div class="it"><span>${esc(x.n)}${x.t?' ('+esc(x.t)+')':''}<br>${m(x.p*x.q)}</span><span class="q"><button class="sec" onclick="ch(${i},-1)">−</button> ${x.q} <button class="sec" onclick="ch(${i},1)">+</button></span></div>`).join(''):'<p>Aún no agregas productos.</p>';
$('tot').textContent='Total: '+m(C.reduce((a,x)=>a+x.p*x.q,0))}
$('vc').onclick=()=>$('cart').classList.add('o');$('x').onclick=()=>$('cart').classList.remove('o');
$('wa').onclick=()=>{if(!C.length)return alert('Agrega productos primero');
let t=`Hola, quiero hacer este pedido${$('nom').value?' (a nombre de '+$('nom').value+')':''}:\n\n`;
C.forEach(x=>t+=`• ${x.q} x ${x.n}${x.t?' - talla '+x.t:''} = ${m(x.p*x.q)}\n`);
t+=`\n${$('tot').textContent}`;if($('nota').value)t+=`\nNotas: ${$('nota').value}`;
window.open(`https://wa.me/${D.whatsapp}?text=${encodeURIComponent(t)}`,'_blank')};
if(window.netlifyIdentity)netlifyIdentity.on('init',u=>{if(!u)netlifyIdentity.on('login',()=>location.href='/admin/')});
</script></body></html>
